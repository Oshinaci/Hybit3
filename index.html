    <!-- Polyfills & Environment Shims for Web3 embedded iframe runtime (MUST BE FIRST IN HEAD) -->
    <script>
      (function() {
        // 1. Guard against WalletConnect prototype error:
        // "TypeError: Cannot set property fetch of #<Window> which has only a getter"
        try {
          var _origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var _currentFetch = _origFetch;

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return _currentFetch || (window && window.fetch);
                },
                set: function(val) {
                  Object.defineProperty(this, 'fetch', {
                    value: val,
                    writable: true,
                    configurable: true,
                    enumerable: true,
                  });
                },
              });
            } catch (e) {}
          }

          if (typeof window !== 'undefined') {
            try {
              Object.defineProperty(window, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return _currentFetch;
                },
                set: function(val) {
                  if (this !== window) {
                    Object.defineProperty(this, 'fetch', {
                      value: val,
                      writable: true,
                      configurable: true,
                      enumerable: true,
                    });
                  } else if (typeof val === 'function') {
                    _currentFetch = val;
                  }
                },
              });
            } catch (e) {}
          }
        } catch (e) {
          console.warn('[Hybit Shim] fetch accessor setup warning:', e);
        }

        // 2. Guard against @base-org/account cross-origin iframe SecurityError:
        // "SecurityError: Failed to read a named property 'ethereum' from 'Window'"
        // When running in an iframe with no injected provider, Base Account SDK attempts to access
        // window.top.ethereum which throws when crossing origin boundaries.
        // Providing a safe local fallback prevents inspecting window.top.
        try {
          if (typeof window !== 'undefined' && !window.ethereum) {
            window.ethereum = {
              isMetaMask: false,
              isCoinbaseBrowser: false,
              isCoinbaseWallet: false,
              isBraveWallet: false,
              on: function() {},
              removeListener: function() {},
              request: function() {
                return Promise.reject(new Error('Injected Web3 provider is not available in preview iframe.'));
              },
            };
          }
        } catch (e) {
          console.warn('[Hybit Shim] ethereum provider shim warning:', e);
        }
      })();
    </script>
